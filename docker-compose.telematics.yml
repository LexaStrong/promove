services:
  # ─────────────────────────────────────────────────────────────
  # ProMove Fleet Operations System (Next.js Application)
  # ─────────────────────────────────────────────────────────────
  promove-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promove-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - telematics-net

  # ─────────────────────────────────────────────────────────────
  # Traccar GPS Hardware Ingestion Gateway (Netty Daemon)
  # ─────────────────────────────────────────────────────────────
  traccar-server:
    image: traccar/traccar:latest
    container_name: traccar-server
    restart: unless-stopped
    ports:
      # Web console & REST API
      - "8082:8082"
      # Concox / GT06 GPS Trackers (Common on Trotros & Taxis in Ghana)
      - "5013:5013/tcp"
      - "5013:5013/udp"
      # Teltonika FMB920 / FMC130 (Buses, Hauling Trucks, VIP Coaches)
      - "5027:5027/tcp"
      - "5027:5027/udp"
      # Coban / TK103 Trackers
      - "5001:5001/tcp"
      - "5001:5001/udp"
      # OsmAnd / Traccar Client Protocol (Driver Mobile GPS)
      - "5055:5055/tcp"
      # Sinotrack / H02 Trackers
      - "5014:5014/tcp"
      - "5014:5014/udp"
    volumes:
      - ./docker/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data:rw
      - traccar-logs:/opt/traccar/logs:rw
    environment:
      - TRACCAR_FORWARD_URL=http://promove-web:3000/api/gps/traccar-webhook
    networks:
      - telematics-net
    depends_on:
      - promove-web

volumes:
  traccar-data:
  traccar-logs:

networks:
  telematics-net:
    driver: bridge
